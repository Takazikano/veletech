<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Custom narudžbina — VeleTech</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;background:#071320;color:#f4f7fb;margin:0;padding:2rem}
      .wrap{max-width:1000px;margin:0 auto}
      .panel{background:#071827;padding:1rem;border-radius:12px;border:1px solid rgba(255,255,255,.04)}
      label{display:block;color:#98a8bc;margin-top:.6rem}
      input{padding:.5rem;border-radius:8px;width:100%;background:transparent;border:1px solid rgba(255,255,255,.06);color:inherit}
      .row{display:flex;gap:.6rem}
      .row>div{flex:1}
      table{width:100%;border-collapse:collapse;margin-top:.8rem}
      th,td{padding:.5rem;border-bottom:1px solid rgba(255,255,255,.04);text-align:left}
      .actions{display:flex;gap:.6rem;margin-top:.8rem}
      .btn{padding:.6rem 1rem;border-radius:8px;background:linear-gradient(135deg,#4fd1c5,#8b5cf6);color:#041018;text-decoration:none;border:none;cursor:pointer}
    </style>
  </head>
  <body>
    <div class="wrap">
      <a href="index.html">← Nazad</a>
      <h1>Custom narudžbina — sastavite listu delova</h1>
      <div class="panel">
        <div class="row">
          <div>
            <label>Naziv dela</label>
            <input id="partName" placeholder="npr. Intel i5 12400F" />
          </div>
          <div>
            <label>Količina</label>
            <input id="partQty" type="number" value="1" />
          </div>
          <div>
            <label>Cena (eur)</label>
            <input id="partPrice" type="number" step="0.01" />
          </div>
        </div>
        <div style="margin-top:.6rem">
          <button class="btn" id="addPart">Dodaj deo</button>
        </div>

        <table id="partsTable">
          <thead><tr><th>Deo</th><th>Količina</th><th>Cena</th><th>Ukupno</th><th></th></tr></thead>
          <tbody></tbody>
        </table>

        <p id="total" style="margin-top:.6rem">Ukupno: 0.00 €</p>

        <label>Ime i prezime</label>
        <input id="buyerName" />
        <label>Email</label>
        <input id="buyerEmail" />

        <div class="actions">
          <button class="btn" id="sendEmail">Pošalji email</button>
          <button class="btn" id="download">Preuzmi narudžbinu</button>
          <button class="btn" id="copy">Kopiraj</button>
        </div>
      </div>
    </div>

    <script>
      const parts = [];
      const tbody = document.querySelector('#partsTable tbody');
      const totalEl = document.getElementById('total');

      function render(){
        tbody.innerHTML = '';
        let total = 0;
        parts.forEach((p, i)=>{
          const tr = document.createElement('tr');
          const subtotal = (p.qty * p.price) || 0;
          total += subtotal;
          tr.innerHTML = `<td>${p.name}</td><td>${p.qty}</td><td>${p.price.toFixed(2)} €</td><td>${subtotal.toFixed(2)} €</td><td><button data-i="${i}" class="remove">x</button></td>`;
          tbody.appendChild(tr);
        });
        totalEl.textContent = `Ukupno: ${total.toFixed(2)} €`;
      }

      document.getElementById('addPart').addEventListener('click', ()=>{
        const name = document.getElementById('partName').value.trim();
        const qty = parseInt(document.getElementById('partQty').value,10) || 1;
        const price = parseFloat(document.getElementById('partPrice').value) || 0;
        if(!name) return alert('Unesite naziv dela');
        parts.push({name,qty,price});
        document.getElementById('partName').value=''; document.getElementById('partQty').value=1; document.getElementById('partPrice').value='';
        render();
      });

      tbody.addEventListener('click', (e)=>{
        if(e.target.classList.contains('remove')){
          const i = +e.target.dataset.i; parts.splice(i,1); render();
        }
      });

      function buildText(){
        const name = document.getElementById('buyerName').value;
        const email = document.getElementById('buyerEmail').value;
        let lines = [];
        lines.push('Custom narudžbina — VeleTech');
        lines.push('Kupac: ' + name);
        lines.push('Email: ' + email);
        lines.push('Lokacija: Serbia');
        lines.push('');
        lines.push('Delovi:');
        let total = 0;
        parts.forEach(p=>{ const subtotal = p.qty * p.price; total += subtotal; lines.push(`- ${p.name} x${p.qty} @ ${p.price.toFixed(2)} € = ${subtotal.toFixed(2)} €`)});
        lines.push(''); lines.push('Ukupno: ' + total.toFixed(2) + ' €');
        return lines.join('\n');
      }

      document.getElementById('sendEmail').addEventListener('click', ()=>{
        const subject = encodeURIComponent('Custom narudžbina');
        const body = encodeURIComponent(buildText());
        location.href = `mailto:veletech@proton.me?subject=${subject}&body=${body}`;
      });

      document.getElementById('download').addEventListener('click', ()=>{
        const blob = new Blob([buildText()],{type:'text/plain'});
        const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='custom-narudzbina.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      });

      document.getElementById('copy').addEventListener('click', async ()=>{
        try{ await navigator.clipboard.writeText(buildText()); alert('Kopirano u clipboard'); }catch(e){ alert('Clipboard nije dostupan'); }
      });
    </script>
  </body>
</html>
